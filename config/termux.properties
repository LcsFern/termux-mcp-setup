### Termux Properties
### Recarregue com: termux-reload-settings

# Cursor
terminal-cursor-style = block
terminal-cursor-blink-rate = 500

# Extra keys
extra-keys = [['ESC','/','-','HOME','UP','END','PGUP'],['TAB','CTRL','ALT','LEFT','DOWN','RIGHT','PGDN']]

# Scrollback
terminal-transcript-rows = 10000

# General
use-black-ui = true
